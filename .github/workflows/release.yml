name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 26.9.12)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (portable, no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Download aria2c
        run: |
          $url = 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip'
          $zip = 'tools\aria2.zip'
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath 'tools\aria2_temp' -Force
          Copy-Item 'tools\aria2_temp\aria2-1.37.0-win-64bit-build1\aria2c.exe' 'tools\aria2c.exe' -Force
          Remove-Item 'tools\aria2_temp' -Recurse -Force
          Remove-Item $zip -Force

      - name: Assemble portable release
        run: |
          $rel = 'release\Yunji'
          if (Test-Path $rel) { Remove-Item $rel -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          New-Item -ItemType Directory -Force -Path "$rel\data" | Out-Null
          Copy-Item 'src-tauri\target\release\yunji-tauri.exe' "$rel\Yunji.exe"
          if (Test-Path 'src-tauri\icons') {
            New-Item -ItemType Directory -Force -Path "$rel\icons" | Out-Null
            Copy-Item 'src-tauri\icons\*.png' "$rel\icons\"
          }
          if (Test-Path 'tools\aria2c.exe') {
            New-Item -ItemType Directory -Force -Path "$rel\tools" | Out-Null
            Copy-Item 'tools\aria2c.exe' "$rel\tools\aria2c.exe"
          }

      - name: Package zip
        id: pack
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { "v$($env:VERSION)" }
          $zip = "Yunji-$tag-windows-x64.zip"
          Compress-Archive -Path 'release\Yunji\*' -DestinationPath $zip -Force
          echo "ZIP=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          VERSION: ${{ inputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.TAG }}
          name: Yunji ${{ steps.pack.outputs.TAG }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.ZIP }}
